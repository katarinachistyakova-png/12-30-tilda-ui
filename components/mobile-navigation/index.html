<!--
  12:30 · Зоны нажатия мобильного меню (mobile-navigation)

  Увеличивает кликабельные области мобильной навигации — бургера, иконок
  поиска, вишлиста и корзины, пунктов раскрытого меню и крестика — минимум
  до 44×44 px, не меняя ни одного размера, шрифта или цвета, которые видит
  глаз.

  Затрагивает только блок T450 rec797916168 (мобильное меню, до 1200 px).
  Desktop-меню, подвал, cookie-баннер и карточку товара не трогает.

  ЧТО ИМЕННО МЕНЯЕТСЯ
    1. Бургер. Сама иконка остаётся 22×14 px на своём месте. Нажатие
       ловит прозрачный псевдоэлемент 44×44 px вокруг неё — иконка при
       этом не растягивается, потому что её полоски позиционированы
       внутри кнопки в процентах и ничего не знают о псевдоэлементе.
       Открытие меню Tilda и так вешает на контейнер .t450__burger_container
       (48×48 px), поэтому поведение не меняется — просто теперь сама
       кнопка тоже перекрывает всю эту область.
    2. Пункты меню. Ссылка из inline-block (высота = высота строки,
       ширина = ширина слова) становится блоком на всю ширину панели
       с min-height: 44px и вертикальным центрированием текста.
       Внешние отступы уменьшены ровно настолько, чтобы общий ритм
       меню остался прежним: шаг между пунктами растёт с 41 до 44 px
       на мобильном и с 51 до 52 px на планшете.
    3. Крестик закрытия. 40×40 → 44×44 px. Визуально незаметно: фон
       кнопки совпадает с фоном панели, иконка центрируется сама.
    4. Иконки поиска, вишлиста и корзины. Видно кружок 48 px, а нажатие
       ловила только ссылка 19×19 px в его середине: мимо промахивались
       даже по центру кружка. Прозрачный псевдоэлемент 48×48 px делает
       зоной нажатия ровно тот кружок, который человек видит. Сам значок
       остаётся 19×19 px на своём месте — псевдоэлемент ничего не двигает
       и не красит, а счётчик на корзине и вишлисте остаётся виден.

  ЧЕГО НЕ ТРОГАЕТ
    разметку и скрипты T450, ссылки и их порядок, анимацию бургера,
    сами значки и их кружки, desktop-меню, другие блоки и страницы.

  ГДЕ ПОДКЛЮЧАТЬ
    Блок T123 на странице хедера (той, где лежит сам блок T450) —
    тогда стили едут вместе с меню на все страницы сайта, включая
    прямые страницы товара, и не попадают в общий HEAD.
    Запасной вариант: Настройки сайта → Ещё → HTML-код внутрь HEAD.

  Удаление: убрать этот блок. Меню вернётся к исходным размерам.
-->
<style>
  /* ------------------------------------------------------------------
     1. Бургер: область нажатия 44×44 px вокруг иконки 22×14 px
     ------------------------------------------------------------------ */

  /* position: relative у .t-menuburger уже задан Tilda — дублируем,
     чтобы псевдоэлемент не уехал, если Tilda когда-нибудь это правило
     поменяет. */
  #rec797916168 .t-menuburger {
    position: relative;
  }

  #rec797916168 .t-menuburger::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    transform: translate(-50%, -50%);
    /* Прозрачный: увеличивается только зона нажатия, не вид кнопки.
       Углы не скругляем: скругление обрезало бы углы зоны нажатия,
       и по факту она была бы кругом 44 px, а не квадратом 44×44. */
  }

  /* Обводку при навигации с клавиатуры не трогаем: Tilda рисует её сама
     правилом :where(.t-records) button:focus-visible, и она видна на
     бургере как была. Своя обводка на этом псевдоэлементе дала бы
     второе кольцо поверх штатного. */

  /* ------------------------------------------------------------------
     2. Пункты раскрытого меню: высота нажатия не меньше 44 px
     ------------------------------------------------------------------ */

  /* Меню T450 показывается только до 1200 px — медиазапрос держит
     правило в тех же границах на случай, если блок когда-нибудь
     включат и на desktop. */
  @media screen and (max-width: 1200px) {
    #rec797916168 .t450__list_item > a.t-menu__link-item {
      display: flex;
      align-items: center;
      box-sizing: border-box;
      min-height: 44px;
      /* Было 15px при высоте строки 36px (шаг 51px).
         Стало 44px + 8px (шаг 52px) — ритм прежний. */
      margin-bottom: 8px;
    }
  }

  /* Брейкпоинт Tilda, на котором шрифт меню падает до 18px: строка 26px,
     шаг был 41px. Без внешнего отступа шаг становится 44px — минимальный
     прирост, при котором зоны нажатия не накладываются друг на друга,
     а меню по-прежнему помещается по высоте на 320×568. */
  @media screen and (max-width: 480px),
         (orientation: landscape) and (max-height: 480px) {
    #rec797916168 .t450__list_item > a.t-menu__link-item {
      margin-bottom: 0;
    }
  }

  /* ------------------------------------------------------------------
     3. Крестик закрытия панели: 40×40 → 44×44 px
     ------------------------------------------------------------------ */

  /* Кнопка — flex с центрированием (правило Tilda), поэтому иконка
     24×20 px остаётся ровно по центру и не меняет размер. */
  #rec797916168 .t450__close {
    width: 44px;
    height: 44px;
  }

  /* ------------------------------------------------------------------
     4. Поиск, вишлист, корзина: нажатие по всему видимому кружку
     ------------------------------------------------------------------ */

  /* Ссылка внутри кружка — блок 19×19 px без позиционирования, поэтому
     position задаётся здесь: иначе псевдоэлемент считал бы координаты от
     дальнего предка и уехал бы из хедера. На раскладку это не влияет —
     ссылка остаётся единственным содержимым своего пункта списка. */
  #rec797916168 .t-menuwidgeticons__link {
    position: relative;
  }

  /* 48×48 px — это ровно кружок .t-menuwidgeticons__icon, который видит
     человек (48 px в ширину, столько же без нижнего отступа в 2 px).
     Не 44: минимум взят с запасом, потому что промахиваться мимо того,
     что нарисовано, человек не должен вовсе, а место есть — соседние
     кружки стоят с шагом 62 px, то есть между зонами остаётся 14 px,
     а до зоны бургера — 24 px. Прозрачный, поэтому ни фона, ни
     обводки у иконок не прибавляется. */
  #rec797916168 .t-menuwidgeticons__link::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 48px;
    height: 48px;
    transform: translate(-50%, -50%);
  }
</style>
