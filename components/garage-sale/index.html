<!--
  12:30 · Garage sale (garage-sale) — страница /garage-sale

  Витрина вещей с точным разделом Tilda «Garage sale». Своего каталога нет:
  название, цена, фото, наличие и ссылка приходят из живой Tilda Store при каждом
  открытии страницы — тем же запросом, что и выдача на главной (components/home-hero/).
  Лера ведёт товары в Tilda: поставила раздел «Garage sale» — вещь появилась здесь.

  Правило выдачи:
    товар в наличии + у него есть раздел ровно «Garage sale» (регистр важен).
    Это условие стоит под любыми фильтрами и не снимается никогда.
  Фильтры работают на уже загруженном ответе Tilda, без новых запросов:
    ВСЕ / ЖЕНСКОЕ / МУЖСКОЕ — разделы «Женское» / «Мужское»;
    КАТЕГОРИЯ — разделы вещей, которые реально есть у товаров Garage sale
      (список строится из ответа Tilda; служебные разделы из NON_GARMENT не показываются);
    ЦЕНА ↑ / ЦЕНА ↓ — повторный клик снимает сортировку.
  Порядок по умолчанию — как в каталоге Tilda: API не отдаёт даты добавления товара
  (поля created/added нет), а поле sort — ручная позиция, не дата. Поэтому «новые сверху»
  не выдумываем и порядок не меняем.
  Состояние пишется в адрес: ?gender=women|men&category=…&sort=price-asc|price-desc.

  Состояния:
    загрузка — серые места под карточки, страница не прыгает;
    пусто    — «Здесь пока ничего нет.» (фильтры остаются); если Garage sale пуст совсем —
               фраза и ссылка в каталог;
    ошибка   — то же, без технических слов. Страница не ломается никогда.

  Tilda отдаёт каталог только страницам на домене сайта (12-30.ru).
  Шапка страницы — отдельный блок T123 (components/home-hero/staging/2-header.html).

  Удаление: удалить блок T123. Глобальные стили сайта не затрагиваются.
-->

  <div class="s1230-gs__bar" hidden>
    <div class="s1230-gs__group">
      <div class="s1230-gs__group" role="group" aria-label="Раздел">

<script>
  (function () {
    var root = document.querySelector('[data-s1230-gs]');
    if (!root || root.getAttribute('data-s1230-gs-ready')) return;
    root.setAttribute('data-s1230-gs-ready', '1');

    var gridEl = root.querySelector('.s1230-gs__grid');
    var noteEl = root.querySelector('.s1230-gs__note');
    var noteText = root.querySelector('.s1230-gs__note-text');
    var barEl = root.querySelector('.s1230-gs__bar');
    var catsEl = root.querySelector('.s1230-gs__cats');
    var catToggle = root.querySelector('[data-cat-toggle]');
    var emptyEl = root.querySelector('.s1230-gs__empty');

    // Тот же каталог, что у главной: весь магазин 12:30, блок на странице /catalogy
    var TILDA_STORE = {
      api: 'https://store.tildaapi.com/api/getproductslist/',
      storepartuid: '909723291111',
      recid: '797040197'
    };
    var CATEGORY = 'Garage sale';   // точное имя раздела в Tilda, регистр важен
    var GENDERS = { women: 'Женское', men: 'Мужское' };   // точные имена разделов Tilda
    // Разделы Tilda, которые не про тип вещи: в КАТЕГОРИИ их нет.
    // «Одежда» — общий раздел-зонтик, он есть почти у каждой вещи и ничего не уточняет.
    var NON_GARMENT = ['Garage sale', 'Женское', 'Мужское', 'Casual', 'Evening', 'Sport style', 'Sport',
      'Одежда', 'Новинки', 'Home'];
    var SORTS = ['price-asc', 'price-desc'];
    var STUBS = 8;

    var state = { gender: 'all', category: '', sort: '' };   // sort пустой — порядок Tilda
    var items = [];          // Garage sale в наличии — единственный источник для всех фильтров
    var partOrder = {};      // порядок разделов как в Tilda

    function decodeText(text) {
      var box = document.createElement('textarea');
      box.innerHTML = text || '';
      return box.value;
    }

    function parseList(json) {
      try { return JSON.parse(json || '[]') || []; } catch (e) { return []; }
    }

    function inStock(quantity) {
      return quantity === '' || quantity === null || quantity === undefined || parseFloat(quantity) > 0;
    }

    // Товар Tilda → то, что нужно карточке. Ничего не дописываем и не исправляем.
    function normalizeProduct(raw, partNames) {
      var editions = raw.editions || [];
      var gallery = parseList(raw.gallery);
      var price = parseFloat(raw.price);
      editions.forEach(function (edition) {
        var p = parseFloat(edition.price);
        if (!isNaN(p) && (isNaN(price) || p < price)) price = p;
      });
      return {
        uid: String(raw.uid),
        title: decodeText(raw.title),
        price: price,
        image: (gallery[0] && gallery[0].img) || (editions[0] && editions[0].img) || '',
        url: String(raw.url || '').replace(/^http:/, 'https:'),
        categories: parseList(raw.partuids).map(function (uid) { return partNames[uid] || ''; }),
        available: editions.length
          ? editions.some(function (edition) { return inStock(edition.quantity); })
          : inStock(raw.quantity)
      };
    }

    // Один запрос при загрузке страницы. Ошибка сети или ответа — reject:
    // страница отличает «не загрузилось» от «пусто»
    function loadProducts() {
      if (!window.fetch) return Promise.reject(new Error('no fetch'));
      var all = [], names = {};

      function pageUrl(slice) {
        return TILDA_STORE.api + '?storepartuid=' + TILDA_STORE.storepartuid + '&recid=' + TILDA_STORE.recid +
          '&getparts=true&size=500&slice=' + slice + '&c=' + Date.now();
      }
      function hasMore(data, slice) { return data.nextslice && slice < 10; }
      // dev-start — ТОЛЬКО ДЛЯ ЛОКАЛЬНОГО ПРОСМОТРА: снимок ответа Tilda вместо сети
      var dev = document.querySelector('meta[name="s1230-dev-catalog"]');
      if (dev) {
        pageUrl = function () { return dev.getAttribute('content'); };
        hasMore = function () { return false; };
      }
      // dev-end

      function page(slice) {
        return fetch(pageUrl(slice)).then(function (response) {
          if (!response.ok) throw new Error('http ' + response.status);
          return response.json();
        }).then(function (data) {
          if (!data || !data.products) throw new Error('bad response');
          (data.parts || []).forEach(function (part) {
            names[part.uid] = part.title;
            partOrder[part.title] = parseFloat(part.sort) || 0;
          });
          all = all.concat(data.products);
          return hasMore(data, slice) ? page(data.nextslice) : null;
        });
      }

      return page(1).then(function () {
        return all.map(function (raw) { return normalizeProduct(raw, names); });
      });
    }

    function isGarageSale(product) {
      return product.available && !isNaN(product.price) && product.categories.indexOf(CATEGORY) !== -1;
    }

    function formatPrice(value) {
      return String(value).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' ₽';
    }

    function el(tag, className, text) {
      var node = document.createElement(tag);
      node.className = className;
      if (text) node.textContent = text;
      return node;
    }

    // ---------- Фильтры и сортировка: только по уже загруженным items ----------

    function visibleItems() {
      var genderName = GENDERS[state.gender];
      var list = items.filter(function (item) {
        return (!genderName || item.categories.indexOf(genderName) !== -1) &&
          (!state.category || item.categories.indexOf(state.category) !== -1);
      });
      if (!state.sort) return list;   // порядок Tilda
      var dir = state.sort === 'price-asc' ? 1 : -1;
      return list.map(function (item, index) { return { item: item, index: index }; })
        .sort(function (a, b) { return (a.item.price - b.item.price) * dir || a.index - b.index; })
        .map(function (entry) { return entry.item; });
    }

    // Типы вещей — разделы, которые реально есть у вещей Garage sale, в порядке Tilda
    function garmentCategories() {
      var seen = {}, list = [];
      items.forEach(function (item) {
        item.categories.forEach(function (name) {
          if (name && !seen[name] && NON_GARMENT.indexOf(name) === -1) {
            seen[name] = true;
            list.push(name);
          }
        });
      });
      return list.sort(function (a, b) { return (partOrder[a] || 0) - (partOrder[b] || 0); });
    }

    function renderCategoryList() {
      catsEl.innerHTML = '';
      var names = garmentCategories();
      catToggle.hidden = !names.length;
      if (!names.length) return;
      [''].concat(names).forEach(function (name) {
        var li = document.createElement('li');
        var button = el('button', 's1230-gs__opt', name || 'Все категории');
        button.type = 'button';
        button.setAttribute('data-category', name);
        li.appendChild(button);
        catsEl.appendChild(li);
      });
    }

    function syncControls() {
      [].forEach.call(barEl.querySelectorAll('[data-gender]'), function (button) {
        var on = button.getAttribute('data-gender') === state.gender;
        button.classList.toggle('is-active', on);
        button.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
      [].forEach.call(barEl.querySelectorAll('[data-sort]'), function (button) {
        var on = button.getAttribute('data-sort') === state.sort;
        button.classList.toggle('is-active', on);
        button.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
      [].forEach.call(catsEl.querySelectorAll('[data-category]'), function (button) {
        var on = button.getAttribute('data-category') === state.category;
        button.classList.toggle('is-active', on);
        button.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
      catToggle.textContent = state.category || 'Категория';
      catToggle.classList.toggle('is-active', !!state.category);
    }

    // ---------- Адрес: ?gender=…&category=…&sort=… (необязательно, без него всё работает) ----------

    function readUrl() {
      try {
        var params = new URLSearchParams(window.location.search);
        var gender = params.get('gender');
        var sort = params.get('sort');
        var category = params.get('category');
        if (GENDERS[gender]) state.gender = gender;
        if (SORTS.indexOf(sort) !== -1) state.sort = sort;
        if (category && garmentCategories().indexOf(category) !== -1) state.category = category;
      } catch (e) {}
    }

    function writeUrl() {
      try {
        var params = new URLSearchParams(window.location.search);
        ['gender', 'category', 'sort'].forEach(function (key) { params.delete(key); });
        if (state.gender !== 'all') params.set('gender', state.gender);
        if (state.category) params.set('category', state.category);
        if (state.sort) params.set('sort', state.sort);
        var query = params.toString();
        history.replaceState(null, '', window.location.pathname + (query ? '?' + query : '') + window.location.hash);
      } catch (e) {}
    }

    // ---------- Вывод ----------

    function showStubs() {
      for (var n = 0; n < STUBS; n++) {
        var stub = el('li', 's1230-gs__card');
        stub.setAttribute('aria-hidden', 'true');
        stub.appendChild(el('span', 's1230-gs__card-media'));
        gridEl.appendChild(stub);
      }
    }

    function showNote(text) {
      gridEl.innerHTML = '';
      gridEl.hidden = true;
      barEl.hidden = true;
      catsEl.hidden = true;
      emptyEl.hidden = true;
      noteText.textContent = text;
      noteEl.hidden = false;
    }

    function render() {
      var list = visibleItems();
      gridEl.innerHTML = '';
      gridEl.classList.remove('is-entering');
      gridEl.hidden = !list.length;
      emptyEl.hidden = !!list.length;

      list.forEach(function (item) {
        var li = el('li', 's1230-gs__card');
        li.setAttribute('data-uid', item.uid);
        var link = el('a', 's1230-gs__card-link');
        link.href = item.url || '/catalogy';

        var media = el('span', 's1230-gs__card-media');
        if (item.image) {
          var photo = el('img', 's1230-gs__card-img');
          photo.src = item.image;
          photo.alt = '';
          photo.loading = 'lazy';
          photo.decoding = 'async';
          media.appendChild(photo);
        }
        link.appendChild(media);
        link.appendChild(el('span', 's1230-gs__card-name', item.title));
        link.appendChild(el('span', 's1230-gs__card-price', formatPrice(item.price)));

        li.appendChild(link);
        gridEl.appendChild(li);
      });
      if (list.length) {
        void gridEl.offsetWidth;
        gridEl.classList.add('is-entering');
      }
      syncControls();
    }

    function setCatsOpen(open) {
      catsEl.hidden = !open;
      catToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    }

    barEl.addEventListener('click', function (event) {
      var button = event.target.closest ? event.target.closest('button') : null;
      if (!button || !barEl.contains(button)) return;
      if (button.hasAttribute('data-cat-toggle')) {
        setCatsOpen(catsEl.hidden);
        return;
      }
      if (button.hasAttribute('data-gender')) state.gender = button.getAttribute('data-gender');
      if (button.hasAttribute('data-sort')) {
        var sort = button.getAttribute('data-sort');
        state.sort = state.sort === sort ? '' : sort;   // повторный клик снимает цену
      }
      writeUrl();
      render();
    });

    catsEl.addEventListener('click', function (event) {
      var button = event.target.closest ? event.target.closest('button') : null;
      if (!button || !catsEl.contains(button)) return;
      state.category = button.getAttribute('data-category');
      setCatsOpen(false);
      writeUrl();
      render();
    });

    showStubs();
    loadProducts().then(function (products) {
      items = products.filter(isGarageSale);
      if (!items.length) {
        showNote('Сейчас здесь пусто. Загляните в каталог — там тоже есть что посмотреть.');
        return;
      }
      renderCategoryList();
      readUrl();
      barEl.hidden = false;
      render();
    }).catch(function () {
      showNote('Вещи не загрузились. Обновите страницу или откройте каталог.');
    });
  })();
</script>
