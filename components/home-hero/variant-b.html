  Отличия от index.html (вариант A): героиня крупнее и смещена вправо,
  переключатель крупнее и стоит под заголовком, ссылки «Смотреть вещи» в hero нет.
  Механика и структура те же.

  Эксперимент для новой главной. Не опубликован, в Tilda не вставлен.
  Одна героиня в трёх состояниях: SPORT / CASUAL / EVENING.
  Пользователь сам переключает состояние, картинки сменяются мягким crossfade.
  Ниже — тестовая полоса из 4 карточек-заглушек (не Tilda Store).

  ИЗОБРАЖЕНИЯ — в одном месте: блок «ОБРАЗЫ ГЕРОИНИ» в разметке ниже.
    Чтобы заменить образ, поменяйте src у нужного <img>.
    Чтобы заменить героиню целиком — поменяйте все три src.
    Кадры должны совпадать по размеру, масштабу и позиции фигуры
    (сейчас 1536×1024, фигура по центру). Состояние задаётся data-state.

  Удаление: удалить блок T123. Глобальные стили сайта не затрагиваются.
-->

<style>
  .s1230-hh {
    /* Цвета. Фон героя подобран под студийный фон фотографий. */
    --s1230-hh-bg-top: #bdbdbc;
    --s1230-hh-bg-mid: #bcbcbb;
    --s1230-hh-bg-floor: #d2d2d1;
    --s1230-hh-text: #000000;
    --s1230-hh-muted: rgba(0, 0, 0, 0.52);
    --s1230-hh-page: #ffffff;
    --s1230-hh-placeholder: #efeeeb;
    --s1230-hh-body: #232323;

    /* Шрифты — берутся из настроек Tilda, как в остальных компонентах */
    --s1230-hh-font-headline: var(--t-headline-font, 'Oswald', Arial, sans-serif);
    --s1230-hh-font-text: var(--t-text-font, 'Inter', Arial, sans-serif);

    /* Высота шапки сайта над героем: экран = 100svh минус шапка */
    --s1230-hh-top-offset: 0px;

    /* Сетка */
    --s1230-hh-gutter: 40px;
    --s1230-hh-max-width: 1240px;

    /* Кадр на desktop. Героиня занимает 3,4–94% высоты исходника, поэтому
       без обрезки головы и ног увеличить её можно максимум примерно в 1,07 раза. */
    --s1230-hh-look-scale: 107%;
    --s1230-hh-look-top: -2.1%;
    --s1230-hh-look-x: 58%;

    /* Смена образа */
    --s1230-hh-fade: 600ms;

    font-family: var(--s1230-hh-font-text);
    color: var(--s1230-hh-text);
    -webkit-font-smoothing: antialiased;
  }

  .s1230-hh *,
  .s1230-hh *::before,
  .s1230-hh *::after {
    box-sizing: border-box;
  }

  /* ---------- Hero ---------- */

  .s1230-hh__hero {
    position: relative;
    height: calc(100vh - var(--s1230-hh-top-offset));
    height: calc(100svh - var(--s1230-hh-top-offset));
    min-height: 560px;
    max-height: 1100px;
    overflow: hidden;
    background: linear-gradient(
      to bottom,
      var(--s1230-hh-bg-top) 0%,
      var(--s1230-hh-bg-mid) 60%,
      var(--s1230-hh-bg-floor) 100%
    );
  }

  .s1230-hh__stage {
    position: absolute;
    inset: 0;
  }

  /* Кадр всегда вписан по высоте: голова и ноги не обрезаются никогда,
     по бокам — тот же студийный фон. Края кадра мягко растворяются в фоне. */
  .s1230-hh__look {
    position: absolute;
    top: var(--s1230-hh-look-top);
    left: var(--s1230-hh-look-x);
    display: block;
    height: var(--s1230-hh-look-scale);
    width: auto;
    max-width: none;
    transform: translateX(-50%);
    opacity: 0;
    -webkit-mask-image:
      linear-gradient(to right, transparent 0, #000 9%, #000 91%, transparent 100%);
    mask-image:
      linear-gradient(to right, transparent 0, #000 9%, #000 91%, transparent 100%);
    user-select: none;
    -webkit-user-drag: none;
  }

  /* Новый образ проявляется поверх предыдущего, предыдущий уходит после —
     так фон не «проседает» в середине перехода. */
  .s1230-hh__look.is-prev {
    opacity: 1;
    z-index: 1;
  }

  .s1230-hh__look.is-active {
    opacity: 1;
    z-index: 2;
    transition: opacity var(--s1230-hh-fade) ease;
  }

  .s1230-hh__title {
    margin: 0;
    font-family: var(--s1230-hh-font-headline);
    font-weight: 500;
    font-size: clamp(44px, 5.2vw, 80px);
    line-height: 0.95;
    letter-spacing: 0.01em;
    text-transform: uppercase;
    color: var(--s1230-hh-text);
  }

  .s1230-hh__title-line {
    display: block;
  }

  .s1230-hh__link {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    font-family: var(--s1230-hh-font-text);
    font-size: 16px;
    font-weight: 400;
    line-height: 1.3;
    color: var(--s1230-hh-text);
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 5px;
    transition: text-underline-offset 200ms ease;
  }

  .s1230-hh__link:hover {
    color: var(--s1230-hh-text);
    text-underline-offset: 8px;
  }

  /* Переключатель: просто слова, активное — чёрное с тонкой линией */
  .s1230-hh__switch {
    display: flex;
    gap: 36px;
    margin: 0;
    padding: 0;
  }

  .s1230-hh__state {
    position: relative;
    -webkit-appearance: none;
    appearance: none;
    margin: 0;
    padding: 12px 0;
    border: 0;
    border-radius: 0;
    background: transparent;
    font-family: var(--s1230-hh-font-text);
    font-size: 17px;
    font-weight: 500;
    line-height: 1;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--s1230-hh-text);
    opacity: 0.58;
    cursor: pointer;
    transition: opacity 250ms ease;
    -webkit-tap-highlight-color: transparent;
  }

  .s1230-hh__state::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0.1em;
    bottom: 4px;
    height: 1px;
    background: currentColor;
    transform: scaleX(0);
    transform-origin: left center;
    transition: transform 300ms ease;
  }

  .s1230-hh__state:hover {
    opacity: 0.75;
  }

  .s1230-hh__state.is-active {
    opacity: 1;
  }

  .s1230-hh__state.is-active::after {
    transform: scaleX(1);
  }

  .s1230-hh__state:focus-visible,
  .s1230-hh__link:focus-visible,
  .s1230-hh__card-link:focus-visible {
    outline: 1px solid var(--s1230-hh-text);
    outline-offset: 4px;
  }

  /* Desktop: заголовок слева внизу, переключатель справа внизу —
     в свободных полях по сторонам от фигуры. */
  .s1230-hh__intro {
    position: absolute;
    z-index: 3;
    left: var(--s1230-hh-gutter);
    bottom: 118px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }

  .s1230-hh__controls {
    position: absolute;
    z-index: 3;
    left: var(--s1230-hh-gutter);
    bottom: 44px;
  }

  /* ---------- Каталог-заглушка ---------- */

  .s1230-hh__catalog {
    background: var(--s1230-hh-page);
    padding: 56px var(--s1230-hh-gutter) 88px;
  }

  .s1230-hh__catalog-inner {
    max-width: var(--s1230-hh-max-width);
    margin: 0 auto;
  }

  .s1230-hh__catalog-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 24px;
  }

  .s1230-hh__catalog-title {
    margin: 0;
    font-family: var(--s1230-hh-font-headline);
    font-weight: 500;
    font-size: 24px;
    line-height: 1.1;
    letter-spacing: 0.01em;
    text-transform: uppercase;
    color: var(--s1230-hh-text);
  }

  .s1230-hh__grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 32px 16px;
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .s1230-hh__card {
    margin: 0;
  }

  .s1230-hh__card-link {
    display: block;
    color: inherit;
    text-decoration: none;
  }

  .s1230-hh__card-media {
    display: block;
    aspect-ratio: 3 / 4;
    background: var(--s1230-hh-placeholder);
    transition: opacity 200ms ease;
  }

  .s1230-hh__card-link:hover .s1230-hh__card-media {
    opacity: 0.85;
  }

  .s1230-hh__card-name {
    display: block;
    margin-top: 12px;
    font-size: 15px;
    line-height: 1.35;
    color: var(--s1230-hh-body);
  }

  .s1230-hh__card-price {
    display: block;
    margin-top: 4px;
    font-size: 15px;
    font-weight: 500;
    line-height: 1.35;
    color: var(--s1230-hh-text);
  }

  /* ---------- Планшет и мобильный ---------- */

  @media (max-width: 899px) {
    .s1230-hh {
      --s1230-hh-gutter: 16px;
    }

    /* Заголовок сверху, фигура в центре, переключатель снизу —
       ничего не ложится на героиню. */
    .s1230-hh__hero {
      display: flex;
      flex-direction: column;
    }

    .s1230-hh__intro {
      order: -1;
      position: relative;
      left: auto;
      bottom: auto;
      flex-direction: row;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      padding: 20px var(--s1230-hh-gutter) 0;
    }

    .s1230-hh__title {
      font-size: clamp(30px, 9vw, 52px);
    }

    .s1230-hh__link {
      flex-shrink: 0;
      min-height: 32px;
      font-size: 15px;
      text-underline-offset: 4px;
    }

    .s1230-hh {
      --s1230-hh-look-scale: 100%;
      --s1230-hh-look-top: 0%;
      --s1230-hh-look-x: 50%;
    }

    .s1230-hh__look {
      -webkit-mask-image:
        linear-gradient(to right, transparent 0, #000 9%, #000 91%, transparent 100%),
        linear-gradient(to bottom, transparent 0, #000 3%, #000 97%, transparent 100%);
      -webkit-mask-composite: source-in;
      mask-image:
        linear-gradient(to right, transparent 0, #000 9%, #000 91%, transparent 100%),
        linear-gradient(to bottom, transparent 0, #000 3%, #000 97%, transparent 100%);
      mask-composite: intersect;
    }

    .s1230-hh__stage {
      position: relative;
      inset: auto;
      flex: 1 1 auto;
      min-height: 0;
    }

    .s1230-hh__controls {
      position: relative;
      left: auto;
      bottom: auto;
      display: flex;
      justify-content: center;
      padding: 0 var(--s1230-hh-gutter) calc(10px + env(safe-area-inset-bottom, 0px));
    }

    .s1230-hh__switch {
      gap: 26px;
    }

    .s1230-hh__state {
      font-size: 15px;
    }

    .s1230-hh__catalog {
      padding: 40px var(--s1230-hh-gutter) 64px;
    }

    .s1230-hh__catalog-title {
      font-size: 20px;
    }

    .s1230-hh__grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 24px 12px;
    }

    .s1230-hh__card-name,
    .s1230-hh__card-price {
      font-size: 14px;
    }
  }

  @media (max-width: 359px) {
    .s1230-hh__switch {
      gap: 18px;
    }

    .s1230-hh__state {
      font-size: 14px;
      letter-spacing: 0.08em;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .s1230-hh__look.is-active,
    .s1230-hh__state,
    .s1230-hh__state::after {
      transition: none;
    }
  }
</style>

<div class="s1230-hh" data-s1230-hh>

<script>
  (function () {
    var root = document.querySelector('[data-s1230-hh]');
    if (!root || root.getAttribute('data-s1230-hh-ready')) return;
    root.setAttribute('data-s1230-hh-ready', '1');

    var looks = root.querySelectorAll('.s1230-hh__look');
    var buttons = root.querySelectorAll('.s1230-hh__state');

    function show(state) {
      var next = root.querySelector('.s1230-hh__look[data-state="' + state + '"]');
      var current = root.querySelector('.s1230-hh__look.is-active');
      if (!next || next === current) return;

      for (var i = 0; i < looks.length; i++) {
        looks[i].classList.remove('is-prev');
        if (looks[i] !== next) looks[i].setAttribute('aria-hidden', 'true');
      }
      if (current) {
        current.classList.remove('is-active');
        current.classList.add('is-prev');
      }
      next.classList.add('is-active');
      next.removeAttribute('aria-hidden');

      for (var j = 0; j < buttons.length; j++) {
        var on = buttons[j].getAttribute('data-state') === state;
        buttons[j].classList.toggle('is-active', on);
        buttons[j].setAttribute('aria-pressed', on ? 'true' : 'false');
      }
    }

    // Предыдущий образ убираем только когда новый полностью проявился
    for (var k = 0; k < looks.length; k++) {
      looks[k].addEventListener('transitionend', function (e) {
        if (e.propertyName !== 'opacity' || !e.target.classList.contains('is-active')) return;
        var prev = root.querySelectorAll('.s1230-hh__look.is-prev');
        for (var p = 0; p < prev.length; p++) prev[p].classList.remove('is-prev');
      });
    }

    for (var b = 0; b < buttons.length; b++) {
      buttons[b].addEventListener('click', function () {
        show(this.getAttribute('data-state'));
      });
    }
  })();
</script>
